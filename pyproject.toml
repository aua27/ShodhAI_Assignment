[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatinv"
version = "0.1.0"
description = "Inverse heat modelling: FV reference solver, inverse PINN, scientific diagnostics"
requires-python = ">=3.11"

[project.scripts]
heatinv = "heatinv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
